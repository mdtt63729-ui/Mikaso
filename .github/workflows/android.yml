name: Build Insta Video Downloader APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
      NDK_VERSION: r27c
      FFMPEG_VERSION: n7.1.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Python for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Select build Python interpreter
        run: |
          PY="$(command -v python3.11 || command -v python3 || command -v python)"
          echo "Using build Python: $PY"
          "$PY" --version
          echo "BUILD_PYTHON=$PY" >> "$GITHUB_ENV"
      - name: Cache NDK and FFmpeg source
        uses: actions/cache@v4
        with:
          path: |
            /tmp/ndk.zip
            /tmp/ffsrc
          key: ffmpeg-${{ env.FFMPEG_VERSION }}-ndk-${{ env.NDK_VERSION }}
      - name: Build FFmpeg for Android arm64
        run: |
          set -euo pipefail
          if [ ! -f /tmp/ndk.zip ]; then
            curl -sL -o /tmp/ndk.zip "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          fi
          rm -rf /tmp/ndk && mkdir -p /tmp/ndk
          unzip -q /tmp/ndk.zip -d /tmp/ndk
          if [ ! -d "/tmp/ffsrc/FFmpeg-${FFMPEG_VERSION}" ]; then
            mkdir -p /tmp/ffsrc
            curl -sL -o /tmp/ff.tar.gz "https://github.com/FFmpeg/FFmpeg/archive/refs/tags/${FFMPEG_VERSION}.tar.gz"
            tar -xzf /tmp/ff.tar.gz -C /tmp/ffsrc
          fi
          NDK_DIR="/tmp/ndk/android-ndk-${NDK_VERSION}" \
          FFMPEG_SRC="/tmp/ffsrc/FFmpeg-${FFMPEG_VERSION}" \
            bash scripts/build-ffmpeg-android.sh
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp "/tmp/ffsrc/FFmpeg-${FFMPEG_VERSION}/ffmpeg"  app/src/main/jniLibs/arm64-v8a/libffmpeg.so
          cp "/tmp/ffsrc/FFmpeg-${FFMPEG_VERSION}/ffprobe" app/src/main/jniLibs/arm64-v8a/libffprobe.so
          file app/src/main/jniLibs/arm64-v8a/*.so
          ls -la app/src/main/jniLibs/arm64-v8a/
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Decode release keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$KEYSTORE_PATH"
      - name: Build signed release APK
        run: gradle --no-daemon assembleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - name: Verify APK signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"
      - name: Report APK size
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BYTES=$(stat -c%s "$APK")
          MIB=$(awk "BEGIN{printf \"%.1f\", $BYTES/1048576}")
          echo "Release APK: $BYTES bytes ($MIB MiB)"
          echo "Native libs packaged in APK:"
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/' || true
          {
            echo "### Release APK size"
            echo ""
            echo "- $BYTES bytes ($MIB MiB)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Insta-Video-Downloader-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Remove keystore
        if: always()
        run: rm -f "$KEYSTORE_PATH"
