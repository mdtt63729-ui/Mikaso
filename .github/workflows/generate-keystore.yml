name: Generate keystore

# Creates ONE permanent Android signing keystore and turns it into the 4 secrets
# the "Build APK" workflow expects:
#
#   MIKASO_KEYSTORE_BASE64   base64 of the .jks file
#   MIKASO_STORE_PASSWORD    keystore password
#   MIKASO_KEY_ALIAS         key alias
#   MIKASO_KEY_PASSWORD      key password
#
# Two ways to receive them, both handled here:
#   1. They are uploaded as a run artifact (download it, then add the 4 secrets
#      under Settings -> Secrets and variables -> Actions).
#   2. If you add a repository secret named GH_PAT (a fine-grained PAT with the
#      "Secrets: Read and write" permission), this workflow sets the 4 secrets
#      for you automatically.
#
# SECURITY: the keystore is the master key to your app's identity. Keep it
# forever, never commit it, and delete the artifact once the secrets are stored.

on:
  workflow_dispatch:
    inputs:
      alias:
        description: "Key alias"
        default: "mikaso"
        type: string
      validity_days:
        description: "Keystore validity in days (10000 = ~27 years)"
        default: "10000"
        type: string
      store_password:
        description: "Keystore password (leave blank to auto-generate a strong one)"
        default: ""
        type: string
      key_password:
        description: "Key password (leave blank to reuse the keystore password)"
        default: ""
        type: string

permissions:
  contents: read

jobs:
  generate:
    name: Generate + upload signing secrets
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore and secret values
        env:
          ALIAS: ${{ inputs.alias }}
          VALIDITY: ${{ inputs.validity_days }}
          STORE_PW_IN: ${{ inputs.store_password }}
          KEY_PW_IN: ${{ inputs.key_password }}
        run: |
          set -euo pipefail
          ALIAS="${ALIAS:-mikaso}"
          VALIDITY="${VALIDITY:-10000}"
          STORE_PW="${STORE_PW_IN:-$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | cut -c1-24)}"
          KEY_PW="${KEY_PW_IN:-$STORE_PW}"

          keytool -genkeypair -v \
            -keystore mikaso-release.jks \
            -storetype PKCS12 \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 4096 -validity "$VALIDITY" \
            -storepass "$STORE_PW" -keypass "$KEY_PW" \
            -dname "CN=Mikaso, OU=Mikaso, O=Mikaso, L=Bengaluru, ST=Karnataka, C=IN"

          base64 -w0 mikaso-release.jks > mikaso-release.jks.base64

          {
            echo "MIKASO_KEYSTORE_BASE64=$(cat mikaso-release.jks.base64)"
            echo "MIKASO_STORE_PASSWORD=$STORE_PW"
            echo "MIKASO_KEY_ALIAS=$ALIAS"
            echo "MIKASO_KEY_PASSWORD=$KEY_PW"
          } > SIGNING_INFO.txt

          # Keep the generated passwords out of the raw log.
          echo "::add-mask::$STORE_PW"
          echo "::add-mask::$KEY_PW"

          echo "keystore_sha256=$(sha256sum mikaso-release.jks | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "Keystore generated (alias: $ALIAS, validity: ${VALIDITY} days)."
        id: gen

      - name: Upload keystore + secret values as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: mikaso-signing-secrets
          path: |
            mikaso-release.jks
            mikaso-release.jks.base64
            SIGNING_INFO.txt
          if-no-files-found: error
          retention-days: 7

      - name: Set the 4 repository secrets automatically (needs GH_PAT)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::notice::No GH_PAT secret set - skipping automatic upload. Download the artifact and add the 4 secrets manually."
            exit 0
          fi
          while IFS='=' read -r name value; do
            [ -z "$name" ] && continue
            printf '%s' "$value" | gh secret set "$name" --repo "$GITHUB_REPOSITORY"
            echo "set $name"
          done < SIGNING_INFO.txt
          echo "::notice::The 4 signing secrets are now set on $GITHUB_REPOSITORY."

      - name: Summary
        run: |
          {
            echo "## Mikaso signing keystore generated"
            echo ""
            echo "SHA-256 of the keystore: \`${{ steps.gen.outputs.keystore_sha256 }}\`"
            echo ""
            echo "The 4 secrets (values are in the **mikaso-signing-secrets** artifact, not in this log):"
            echo ""
            echo "| Secret | What it is |"
            echo "| --- | --- |"
            echo "| \`MIKASO_KEYSTORE_BASE64\` | base64 of \`mikaso-release.jks\` |"
            echo "| \`MIKASO_STORE_PASSWORD\` | keystore password |"
            echo "| \`MIKASO_KEY_ALIAS\` | key alias |"
            echo "| \`MIKASO_KEY_PASSWORD\` | key password |"
            echo ""
            echo "Next: **Settings → Secrets and variables → Actions**, add those four, then run the **Build APK** workflow with \`signed: true\`."
            echo ""
            echo "> Delete the artifact once the secrets are stored. Never commit the .jks."
          } >> "$GITHUB_STEP_SUMMARY"
