plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.chaquo.python'
}

android {
    namespace 'com.instavideodownloader.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.instavideodownloader.app'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        ndk { abiFilters 'arm64-v8a' }
    }

    // Release signing. The keystore path and passwords are supplied by the CI
    // environment (GitHub Actions secrets) and are never stored in the repo.
    signingConfigs {
        release {
            def storePath = System.getenv('KEYSTORE_PATH')
            if (storePath != null) {
                storeFile file(storePath)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            // Sign only when a keystore is available; local builds without the
            // environment variables still work (they produce an unsigned APK).
            if (System.getenv('KEYSTORE_PATH') != null) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            shrinkResources false
        }
    }

    // ffmpeg/ffprobe ship as jniLibs/arm64-v8a/libffmpeg.so and libffprobe.so so
    // Android extracts them as executable files in the app's native library dir
    // (the only place an app may execute its own binaries on modern Android).
    packaging {
        jniLibs {
            useLegacyPackaging = true
            keepDebugSymbols += ['**/libffmpeg.so', '**/libffprobe.so']
        }
    }

    buildFeatures { compose true; buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

chaquopy {
    defaultConfig {
        version = '3.11'
        // The interpreter used to run the build. CI passes an absolute path
        // (BUILD_PYTHON); locally it falls back to the python3.11 command.
        buildPython(System.getenv('BUILD_PYTHON') ?: 'python3.11')
        pip { install 'yt-dlp' }
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.activity:activity-compose:1.10.0'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
